# ─────────────────────────────────────────────
#  KANAGAWA INK  |  ghostty config
#  deeper black variant  |  bg: #0d0c0c
# ─────────────────────────────────────────────

font-family = JetBrainsMono Nerd Font
font-size = 13
font-feature = calt
font-feature = liga
font-thicken = false

cursor-style = block
cursor-style-blink = false
mouse-hide-while-typing = true
scrollback-limit = 100000

window-padding-x = 10
window-padding-y = 6
window-padding-balance = true
window-decoration = true
window-theme = dark
window-inherit-working-directory = true
window-save-state = always
background-opacity = 1.0
unfocused-split-opacity = 0.72
shell-integration = detect

background           = 0d0c0c
foreground           = dcd7ba
cursor-color         = c8c093
selection-background = 1a1a1a
selection-foreground = dcd7ba

palette = 0=#0d0c0c
palette = 1=#c34043
palette = 2=#76946a
palette = 3=#c0a36e
palette = 4=#7e9cd8
palette = 5=#957fb8
palette = 6=#6a9589
palette = 7=#c8c093
palette = 8=#727169
palette = 9=#e82424
palette = 10=#98bb6c
palette = 11=#e6c384
palette = 12=#7fb4ca
palette = 13=#938aa9
palette = 14=#7aa89f
palette = 15=#dcd7ba

keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+minus=new_split:down
keybind = ctrl+shift+h=goto_split:left
keybind = ctrl+shift+l=goto_split:right
keybind = ctrl+shift+k=goto_split:top
keybind = ctrl+shift+j=goto_split:bottom
keybind = ctrl+shift+e=equalize_splits
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_surface
keybind = ctrl+tab=next_tab
keybind = ctrl+shift+tab=previous_tab
keybind = ctrl+equal=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+0=reset_font_size
