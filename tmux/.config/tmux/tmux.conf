# ~/.tmux.conf – Typecraft‑style tmux

# — Basic settings
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# — Mouse and UI
set -g mouse on
set -g status-position top
set -g status-style "bg=default"

# — Leader key (Ctrl‑s, like Typecraft)
set -g prefix C-s
unbind C-b
set -g prefix2 F12

# — Reload conf
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# — Pane movement (HJKL)
unbind h
unbind j
unbind k
unbind l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# — Splitting panes (shorter bindings)
bind - split-window -h    # Ctrl‑s -
bind | split-window -v    # Ctrl‑s |

# — Sane window and pane switching
bind -n C-l next-window
bind -n C-h previous-window

# — Copy mode (vim‑style)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# — Plugins (TPM – Typecraft‑style plugin setup)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# — Catppuccin theme flags
set -g @catppuccin_flavour 'mocha'          # or 'latte', 'frappe', 'macchiato'
set -g @catppuccin_window_left_separator '█'
set -g @catppuccin_window_right_separator '█'
set -g @catppuccin_window_middle_separator '│'
set -g @catppuccin_window_number_position 'right'

# — Install TPM once and run
set -g @tpm_plugins 'tmux-plugins/tpm catppuccin/tmux'
run '~/.tmux/plugins/tpm/tpm'

# — Optional: keep current path in new panes
bind c new-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
